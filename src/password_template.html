        border-radius: 50%;
        animation: spinner-border 0.75s linear infinite;
      }
      @keyframes spinner-border { 100% { transform: rotate(360deg); } }
      .staticrypt-content {
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem 0 calc(1.25rem + env(safe-area-inset-bottom));

        width: min(100% - 1.5rem, 26rem);
        margin: 0 auto;

      .staticrypt-form {

        border-radius: 1.75rem;

        box-shadow: 0 16px 40px rgba(168, 92, 120, 0.16);
        text-align: center;

      .lock-heart { width: 42px; height: 42px; fill: #e07a98; margin-bottom: 0.35rem; }
      .staticrypt-title {

      .staticrypt-password-container { position: relative; margin-bottom: 0.9rem; }
      .staticrypt-form input[type="password"],
      .staticrypt-form input[type="text"] {
        width: 100%;
        border: 1.5px solid #f3d0dc;
        background: #fff8fa;
        border-radius: 1rem;
        padding: 0.95rem 3rem 0.95rem 1rem;
        font-size: 16px;
        font-family: inherit;
        color: #3c2430;
      }
      .staticrypt-form input:focus { outline: 3px solid #8e2a52; outline-offset: 2px; }
      .staticrypt-toggle-password-visibility {
        cursor: pointer;
        position: absolute;
        right: 0.35rem;
        top: 50%;
        transform: translateY(-50%);
        width: 2.5rem;
        height: 2.5rem;
        padding: 0.55rem;
        opacity: 0.7;
      }
      label.staticrypt-remember {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0.7rem;
        text-align: left;
        margin: 0.2rem 0 1rem;
        font-size: 1.05rem;
        line-height: 1.45;
      }
      .staticrypt-remember input[type="checkbox"] {
        width: 1.35rem;
        height: 1.35rem;
        accent-color: #8e2a52;
        flex: none;
      }
      .staticrypt-decrypt-button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: #8e2a52;
        color: #fff;
        font-family: inherit;
        font-size: 1.15rem;
        font-weight: 700;
        padding: 0.9rem 1rem;
        cursor: pointer;
      }
      .staticrypt-decrypt-button:hover,
      .staticrypt-decrypt-button:focus { background: #742443; }
      .staticrypt-decrypt-button:focus-visible { outline: 3px solid #8e2a52; outline-offset: 3px; }
      .spark {
        position: fixed;
        width: 16px;
        height: 16px;
        fill: #d7b7f0;
        opacity: 0.7;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .staticrypt-spinner { animation: none; }
      }

        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,

        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();

        const passwordInput = document.getElementById("staticrypt-password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.src = imgSrcEyeOpened;
          toggleIcon.alt = templateToggleAltHide;
          toggleIcon.title = templateToggleAltHide;
        } else {
          passwordInput.type = "password";
          toggleIcon.src = imgSrcEyeClosed;
          toggleIcon.alt = templateToggleAltShow;
          toggleIcon.title = templateToggleAltShow;
        }
      });

      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const password = document.getElementById("staticrypt-password").value,
          isRememberChecked = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
